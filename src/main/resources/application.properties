spring.application.name=el-limoncito
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/el_limoncito
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CONTRASENA:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
