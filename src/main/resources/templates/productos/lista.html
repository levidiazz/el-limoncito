<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Productos')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container py-4">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Catálogo de productos</h1>
        <a class="btn btn-principal" th:href="@{/productos/nuevo}">Nuevo producto</a>
    </div>
    <form class="row g-2 mb-3" th:action="@{/productos}" method="get">
        <div class="col-sm-6 col-md-4">
            <input class="form-control" type="search" name="texto" th:value="${texto}" placeholder="Buscar por nombre o código">
        </div>
        <div class="col-sm-4 col-md-3">
            <select class="form-select" name="idCategoria">
                <option value="0">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${c.id == idCategoria}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        </div>
    </form>
    <div class="panel table-responsive">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th class="text-end">Menudeo</th>
                <th class="text-end">Mayoreo</th>
                <th>Estado</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.codigoBarras}"></td>
                <td>
                    <span th:text="${p.nombre}"></span>
                    <small class="text-muted d-block" th:text="${p.presentacion}"></small>
                </td>
                <td th:text="${p.categoria.nombre}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(p.precioMenudeo, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(p.precioMayoreo, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <span th:if="${p.activo}" class="badge text-bg-success">Activo</span>
                    <span th:unless="${p.activo}" class="badge text-bg-secondary">Baja</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/productos/{id}/editar(id=${p.id})}">Modificar</a>
                    <form class="d-inline" th:if="${p.activo}" th:action="@{/productos/{id}/baja(id=${p.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
                    </form>
                    <form class="d-inline" th:unless="${p.activo}" th:action="@{/productos/{id}/reactivar(id=${p.id})}" method="post">
                        <button class="btn btn-sm btn-outline-success" type="submit">Reactivar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${productos.isEmpty()}">
                <td colspan="7" class="text-center text-muted">No se encontraron productos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
