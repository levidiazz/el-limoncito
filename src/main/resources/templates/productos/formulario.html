<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container py-4" style="max-width: 760px;">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <h1 class="h4 mb-3" th:text="${titulo}"></h1>
    <form class="panel" th:action="@{${accion}}" th:object="${productoFormulario}" method="post" novalidate>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label" for="codigoBarras">Código de barras</label>
                <input class="form-control" id="codigoBarras" type="text" th:field="*{codigoBarras}"
                       th:classappend="${#fields.hasErrors('codigoBarras')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{codigoBarras}"></div>
            </div>
            <div class="col-md-8">
                <label class="form-label" for="nombre">Nombre</label>
                <input class="form-control" id="nombre" type="text" th:field="*{nombre}"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="presentacion">Presentación</label>
                <input class="form-control" id="presentacion" type="text" th:field="*{presentacion}"
                       th:classappend="${#fields.hasErrors('presentacion')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{presentacion}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="idCategoria">Categoría</label>
                <select class="form-select" id="idCategoria" th:field="*{idCategoria}"
                        th:classappend="${#fields.hasErrors('idCategoria')} ? 'is-invalid'">
                    <option value="">Selecciona una categoría</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{idCategoria}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="precioMenudeo">Precio de menudeo (MXN)</label>
                <input class="form-control" id="precioMenudeo" type="number" step="0.01" min="0" th:field="*{precioMenudeo}"
                       th:classappend="${#fields.hasErrors('precioMenudeo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{precioMenudeo}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="precioMayoreo">Precio de mayoreo (MXN)</label>
                <input class="form-control" id="precioMayoreo" type="number" step="0.01" min="0" th:field="*{precioMayoreo}"
                       th:classappend="${#fields.hasErrors('precioMayoreo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{precioMayoreo}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cantidadMinMayoreo">Mínimo para mayoreo</label>
                <input class="form-control" id="cantidadMinMayoreo" type="number" min="1" th:field="*{cantidadMinMayoreo}"
                       th:classappend="${#fields.hasErrors('cantidadMinMayoreo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{cantidadMinMayoreo}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="stockMinimo">Stock mínimo</label>
                <input class="form-control" id="stockMinimo" type="number" min="0" th:field="*{stockMinimo}"
                       th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{stockMinimo}"></div>
            </div>
            <div class="col-md-8">
                <div class="form-check mb-2">
                    <input class="form-check-input" id="retornable" type="checkbox" th:field="*{retornable}">
                    <label class="form-check-label" for="retornable">Envase retornable</label>
                </div>
                <select class="form-select" id="idTipoEnvase" th:field="*{idTipoEnvase}">
                    <option value="">Sin tipo de envase</option>
                    <option th:each="e : ${envases}" th:value="${e.id}" th:text="${e.nombre}"></option>
                </select>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-principal" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
