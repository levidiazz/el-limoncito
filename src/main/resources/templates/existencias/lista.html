<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/plantilla :: cabecera('Existencias')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container py-4">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <h1 class="h4 mb-3">Existencias</h1>
    <form class="row g-2 mb-3" th:action="@{/existencias}" method="get">
        <div class="col-sm-6 col-md-4">
            <input class="form-control" type="search" name="texto" th:value="${texto}" placeholder="Buscar por nombre o código">
        </div>
        <div class="col-sm-4 col-md-3">
            <select class="form-select" name="idCategoria">
                <option value="0">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${c.id == idCategoria}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        </div>
    </form>

    <div class="alert alert-warning" th:if="${!bajoMinimo.isEmpty()}" sec:authorize="hasRole('GERENTE_GENERAL')">
        <strong>Productos bajo su stock mínimo:</strong>
        <ul class="mb-0">
            <li th:each="e : ${bajoMinimo}"
                th:text="${e.nombre + ' - existencia ' + e.existencia + ' de ' + e.stockMinimo + ' mínimas'}"></li>
        </ul>
    </div>

    <div class="panel table-responsive">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th class="text-end">Existencia</th>
                <th class="text-end">Stock mínimo</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${existencias}" th:classappend="${e.existencia < e.stockMinimo} ? 'fila-alerta'">
                <td th:text="${e.codigoBarras}"></td>
                <td>
                    <span th:text="${e.nombre}"></span>
                    <small class="text-muted d-block" th:text="${e.presentacion}"></small>
                </td>
                <td th:text="${e.categoria}"></td>
                <td class="text-end fw-bold" th:text="${e.existencia}"></td>
                <td class="text-end" th:text="${e.stockMinimo}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/existencias/{id}/lotes(id=${e.idProducto})}">Ver lotes</a>
                </td>
            </tr>
            <tr th:if="${existencias.isEmpty()}">
                <td colspan="6" class="text-center text-muted">No se encontraron productos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
