<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Lotes del producto')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container py-4">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <h1 class="h4 mb-1" th:text="${producto.nombre}"></h1>
    <p class="text-muted" th:text="${producto.presentacion}"></p>
    <div class="panel">
        <h2 class="h6">Lotes vigentes, del primero a vender al último (PEPS)</h2>
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Entrada</th>
                <th>Fecha de entrada</th>
                <th>Caducidad</th>
                <th class="text-end">Disponible</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l : ${lotes}">
                <td th:text="${l.entrada.folioNota}"></td>
                <td th:text="${#temporals.format(l.fechaEntrada, 'dd/MM/yyyy')}"></td>
                <td th:text="${l.fechaCaducidad != null} ? ${#temporals.format(l.fechaCaducidad, 'dd/MM/yyyy')} : 'Sin caducidad'"></td>
                <td class="text-end" th:text="${l.cantidadDisponible}"></td>
            </tr>
            <tr th:if="${lotes.isEmpty()}">
                <td colspan="4" class="text-center text-muted">El producto no tiene lotes con existencia.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <a class="btn btn-link mt-3" th:href="@{/existencias}">Volver a existencias</a>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
