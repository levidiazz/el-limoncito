<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera(${titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container" style="max-width: 44rem;">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <div class="encabezado-pagina">
        <h1 class="h4" th:text="${titulo}"></h1>
    </div>
    <form class="panel" th:action="@{${accion}}" th:object="${clienteFormulario}" method="post" novalidate>
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="telefono">Teléfono</label>
            <input class="form-control" id="telefono" type="text" inputmode="numeric" maxlength="10" th:field="*{telefono}"
                   th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{telefono}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="perfil">Perfil de precio</label>
            <select class="form-select" id="perfil" th:field="*{perfil}"
                    th:classappend="${#fields.hasErrors('perfil')} ? 'is-invalid'">
                <option value="MINORISTA">Minorista: precio de menudeo, mayoreo desde la cantidad mínima</option>
                <option value="MAYORISTA">Mayorista: siempre precio de mayoreo</option>
                <option value="DISTRIBUIDOR">Distribuidor: siempre precio de mayoreo</option>
            </select>
            <div class="invalid-feedback" th:errors="*{perfil}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-principal" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
