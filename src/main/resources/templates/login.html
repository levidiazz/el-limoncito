<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Iniciar sesión')}"></head>
<body>
<main class="container">
    <div class="contenedor-login">
        <h1 class="h3 text-center mb-4">El Limoncito</h1>
        <form class="panel" th:action="@{/login}" method="post">
            <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="alert alert-danger" th:if="${param.bloqueado}">La cuenta está bloqueada. Solicita al administrador que la desbloquee.</div>
            <div class="alert alert-warning" th:if="${param.inactivo}">La cuenta está dada de baja.</div>
            <div class="alert alert-success" th:if="${param.salida}">Cerraste sesión correctamente.</div>
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control" id="username" name="username" type="text" autocomplete="username" autofocus required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-principal w-100" type="submit">Entrar</button>
        </form>
    </div>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
