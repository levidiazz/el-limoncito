<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | El Limoncito'">El Limoncito</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark barra">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}">El Limoncito</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item dropdown" sec:authorize="hasRole('GERENTE_GENERAL')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Catálogo</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/categorias}">Categorías</a></li>
                        <li><a class="dropdown-item" th:href="@{/productos}">Productos</a></li>
                        <li><a class="dropdown-item" th:href="@{/proveedores}">Proveedores</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasAnyRole('GERENTE_GENERAL','VENTAS','ALMACEN')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Inventario</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/existencias}">Existencias</a></li>
                        <li sec:authorize="hasRole('ALMACEN')"><a class="dropdown-item" th:href="@{/entradas}">Entradas de mercancía</a></li>
                        <li sec:authorize="hasRole('ALMACEN')"><a class="dropdown-item" th:href="@{/mermas}">Mermas</a></li>
                        <li sec:authorize="hasRole('ALMACEN')"><a class="dropdown-item" th:href="@{/envases}">Envases retornables</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
            </ul>
            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" sec:authentication="name">usuario</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/cuenta/contrasena}">Cambiar contraseña</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
