<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | El Limoncito'">El Limoncito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav th:fragment="menu" class="barra" aria-label="Menú principal">
    <div class="barra-cabecera">
        <a class="marca" th:href="@{/}">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <ellipse cx="16" cy="18" rx="12" ry="9" transform="rotate(-28 16 18)" fill="#e9dc4a"/>
                <path d="M9 17c1.5-3.5 5-5.5 9-5.5" fill="none" stroke="#faf6cf" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M21 8c1.8-3 5-3.8 8-3.2-.4 3.2-3.4 5.6-8 3.2z" fill="#7fc15a"/>
            </svg>
            <span>El Limoncito</span>
        </a>
        <button class="barra-boton" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-label="Abrir o cerrar el menú">
            <i class="bi bi-list"></i>
        </button>
    </div>
    <div class="collapse barra-cuerpo" id="menuPrincipal">
        <a class="barra-enlace" th:href="@{/}"><i class="bi bi-house-door"></i>Inicio</a>

        <div class="barra-grupo" sec:authorize="hasAnyRole('VENTAS','GERENTE_GENERAL')">Ventas</div>
        <a class="barra-enlace" th:href="@{/ventas/nueva}" sec:authorize="hasRole('VENTAS')"><i class="bi bi-cash-coin"></i>Nueva venta</a>
        <a class="barra-enlace" th:href="@{/ventas}" sec:authorize="hasAnyRole('VENTAS','GERENTE_GENERAL')"><i class="bi bi-receipt"></i>Ventas y comprobantes</a>
        <a class="barra-enlace" th:href="@{/clientes}" sec:authorize="hasAnyRole('VENTAS','GERENTE_GENERAL')"><i class="bi bi-people"></i>Clientes</a>
        <a class="barra-enlace" th:href="@{/devoluciones}" sec:authorize="hasRole('VENTAS')"><i class="bi bi-arrow-return-left"></i>Devolución de envases</a>

        <div class="barra-grupo" sec:authorize="hasAnyRole('GERENTE_GENERAL','VENTAS','ALMACEN')">Inventario</div>
        <a class="barra-enlace" th:href="@{/existencias}" sec:authorize="hasAnyRole('GERENTE_GENERAL','VENTAS','ALMACEN')"><i class="bi bi-boxes"></i>Existencias</a>
        <a class="barra-enlace" th:href="@{/entradas}" sec:authorize="hasRole('ALMACEN')"><i class="bi bi-box-arrow-in-down"></i>Entradas de mercancía</a>
        <a class="barra-enlace" th:href="@{/mermas}" sec:authorize="hasRole('ALMACEN')"><i class="bi bi-trash3"></i>Mermas</a>
        <a class="barra-enlace" th:href="@{/envases}" sec:authorize="hasRole('ALMACEN')"><i class="bi bi-recycle"></i>Envases retornables</a>

        <div class="barra-grupo" sec:authorize="hasRole('GERENTE_GENERAL')">Catálogo</div>
        <a class="barra-enlace" th:href="@{/productos}" sec:authorize="hasRole('GERENTE_GENERAL')"><i class="bi bi-tag"></i>Productos y precios</a>
        <a class="barra-enlace" th:href="@{/categorias}" sec:authorize="hasRole('GERENTE_GENERAL')"><i class="bi bi-diagram-3"></i>Categorías</a>
        <a class="barra-enlace" th:href="@{/proveedores}" sec:authorize="hasRole('GERENTE_GENERAL')"><i class="bi bi-truck"></i>Proveedores</a>

        <div class="barra-grupo" sec:authorize="hasRole('ADMINISTRADOR')">Administración</div>
        <a class="barra-enlace" th:href="@{/usuarios}" sec:authorize="hasRole('ADMINISTRADOR')"><i class="bi bi-person-gear"></i>Usuarios y roles</a>

        <div class="barra-usuario" sec:authorize="isAuthenticated()">
            <span class="nombre" sec:authentication="name">usuario</span>
            <a class="barra-enlace" th:href="@{/cuenta/contrasena}"><i class="bi bi-key"></i>Cambiar contraseña</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="barra-enlace"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
