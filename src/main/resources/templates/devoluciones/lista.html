<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/plantilla :: cabecera('Devolución de envases')}"></head>
<body>
<nav th:replace="~{fragmentos/plantilla :: menu}"></nav>
<main class="container">
    <div th:replace="~{fragmentos/plantilla :: mensajes}"></div>
    <div class="encabezado-pagina">
        <div>
            <h1 class="h4">Devolución de envases</h1>
            <p>Devoluciones registradas hoy, para cuadrar el efectivo de la caja.</p>
        </div>
        <div class="acciones">
            <a class="btn btn-outline-secondary" th:href="@{/devoluciones/pendientes}">Envases pendientes por cliente</a>
            <a class="btn btn-principal" th:href="@{/devoluciones/nueva}"><i class="bi bi-plus-lg me-1"></i>Registrar devolución</a>
        </div>
    </div>
    <div class="panel table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th class="col-num">#</th>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Tipo de envase</th>
                <th class="text-end">Envases</th>
                <th class="text-end">Importe devuelto</th>
                <th>Registró</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d, fila : ${devoluciones}">
                <td class="col-num" th:text="${fila.count}"></td>
                <td th:text="${#temporals.format(d.movimiento.fechaHora, 'HH:mm')}"></td>
                <td class="fw-semibold" th:text="${d.cliente}"></td>
                <td th:text="${d.movimiento.tipoEnvase.nombre}"></td>
                <td class="text-end" th:text="${d.movimiento.cantidad}"></td>
                <td class="text-end" th:text="${'$' + #numbers.formatDecimal(d.movimiento.monto, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${d.movimiento.usuario.nombreCompleto}"></td>
                <td class="col-acciones">
                    <form class="d-inline" th:action="@{/devoluciones/{id}/cancelar(id=${d.movimiento.id})}" method="post"
                          data-confirmar="¿Cancelar esta devolución? Se revierten el depósito y los envases.">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${devoluciones.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4">Todavía no hay devoluciones hoy.</td>
            </tr>
            </tbody>
            <tfoot th:if="${!devoluciones.isEmpty()}">
            <tr>
                <td></td>
                <td colspan="4">Total reintegrado hoy</td>
                <td class="text-end" th:text="${'$' + #numbers.formatDecimal(totalReintegrado, 1, 'COMMA', 2, 'POINT')}"></td>
                <td colspan="2"></td>
            </tr>
            </tfoot>
        </table>
    </div>
</main>
<th:block th:replace="~{fragmentos/plantilla :: scripts}"></th:block>
</body>
</html>
